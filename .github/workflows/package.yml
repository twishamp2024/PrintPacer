name: Build and Publish Developer Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PrintPacer.sln

      - name: Build solution (Release)
        run: dotnet build PrintPacer.sln -c Release --no-restore

      - name: Run test suite
        run: dotnet test tests/PrintPacer.Tests/PrintPacer.Tests.csproj -c Release --no-build

      - name: Pack PrintPacer.Core NuGet Package
        run: dotnet pack src/PrintPacer.Core/PrintPacer.Core.csproj -c Release --no-build -o ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push ./nupkg/*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintPacer.Core-nuget-package
          path: ./nupkg/*.nupkg
